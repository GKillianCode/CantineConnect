app:
  demo:
    runner:
      enabled: true
  mail:
    from: ${MAIL_FROM:}

spring:
  application:
    name: CantineConnectV2
  profiles:
    active: dev
  output:
    ansi:
      enabled: ALWAYS

  datasource:
    url: jdbc:mysql://localhost:3307/cantine_connectV2?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: cantine_userV2
    password: cantine_password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: ${MAIL_PROTOCOL:smtp}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth:
            ${MAIL_SMTP_AUTH: false}
          starttls:
            enable:
              ${MAIL_SMTP_STARTTLS_ENABLE: false}

springdoc:
  api-docs:
    enabled: true

  swagger-ui:
    enabled: true
