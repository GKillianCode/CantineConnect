spring:
  application:
    name: CantineConnect

  datasource:
    url: jdbc:mysql://localhost:3307/cantine_connect?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: cantine_user
    password: cantine_password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
