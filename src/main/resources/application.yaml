app:
  demo:
    runner:
      enabled: true

spring:
  application:
    name: CantineConnectV2
  profiles:
    active: dev
  output:
    ansi:
      enabled: ALWAYS

  datasource:
    url: jdbc:mysql://localhost:3307/cantine_connectV2?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: cantine_userV2
    password: cantine_password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

springdoc:
  api-docs:
    enabled: true

  swagger-ui:
    enabled: true
