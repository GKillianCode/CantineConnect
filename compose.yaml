services:
  mysql:
    image: mysql:8.4
    container_name: cantineconnectV2-db
    environment:
      MYSQL_DATABASE: cantine_connectV2
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: cantine_userV2
      MYSQL_PASSWORD: cantine_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  mailhog:
    image: mailhog/mailhog:latest
    container_name: cantineconnectV2-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mysql_data:
